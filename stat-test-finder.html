<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistical test finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EF; --surface:#F7F9F8; --code-bg:#E2E8E6; --ink:#18232D; --ink-2:#4A5864; --rule:#C6D0CF;
  --marker:#F4DA6B; --marker-ink:#18232D; --accent:#1F4E79;
  --ready:#2C6A4C; --helper:#8B5B00; --judgment:#8F2C4C;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A1F; --surface:#1B232A; --code-bg:#202A32; --ink:#E3E9EB; --ink-2:#9EABB4; --rule:#33404A;
    --marker:#5E5215; --marker-ink:#FFF4C2; --accent:#93BCE3;
    --ready:#79C29C; --helper:#E2B455; --judgment:#E68AA7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A1F; --surface:#1B232A; --code-bg:#202A32; --ink:#E3E9EB; --ink-2:#9EABB4; --rule:#33404A;
  --marker:#5E5215; --marker-ink:#FFF4C2; --accent:#93BCE3;
  --ready:#79C29C; --helper:#E2B455; --judgment:#E68AA7;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:1.0625rem;line-height:1.55}
code,pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84rem}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1rem,3vw,2rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.5rem 2rem;padding-top:1.6rem;border-bottom:1px solid var(--rule)}
.top h1{font-size:1.3rem;margin:0;letter-spacing:-.01em}
.lede{margin:.1rem 0 1rem;color:var(--ink-2)}
.tabs{display:flex;gap:1.6rem}
.tab{background:none;border:0;padding:.6rem 0;margin-bottom:-1px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* find view */
.find{display:grid;grid-template-columns:minmax(200px,270px) minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);padding-block:2.25rem 3.5rem}
.trail h2{font-size:.95rem;color:var(--ink-2);margin:0 0 .9rem}
.trail ol{list-style:none;margin:0;padding:0}
.trail li{position:relative;padding:0 0 1.1rem 1.65rem}
.trail li::before{content:"";position:absolute;left:.37rem;top:1rem;bottom:-.2rem;width:2px;background:var(--rule)}
.trail li:last-child::before{display:none}
.trail li::after{content:"";position:absolute;left:.04rem;top:.33rem;width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--ink);background:var(--ink)}
.trail li.now::after{background:var(--paper);border-style:dashed}
.trail li.end::after{background:var(--marker)}
.trail button{all:unset;display:block;cursor:pointer;border-radius:4px}
.trail button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.trail button:hover .a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.trail .q{display:block;font-size:.85rem;color:var(--ink-2)}
.trail .a{display:block;font-weight:700;line-height:1.35}
.pending{color:var(--ink-2);font-weight:400 !important;font-style:italic}
.mk{background:linear-gradient(to top,var(--marker) 0 42%,transparent 42%);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mk.full{background:var(--marker);color:var(--marker-ink);padding:.05em .3em}

.stage > *{animation:enter .2s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.stage > *{animation:none}}
.stage h2,.lh h2{font-size:clamp(1.55rem,1.1rem + 1.6vw,2.15rem);line-height:1.18;margin:0 0 .6rem;max-width:30ch;letter-spacing:-.015em}
.stage h2:focus,.detail h2:focus{outline:none}
.help{color:var(--ink-2);max-width:62ch;margin:0}
.opts{list-style:none;margin:1.5rem 0 0;padding:0;border-top:1px solid var(--rule);max-width:46rem}
.opts li{border-bottom:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:2.2rem 1fr;gap:.9rem;width:100%;text-align:left;background:none;border:0;padding:1rem .75rem 1rem .25rem;cursor:pointer;align-items:start}
.opt:hover{background:var(--surface)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.key{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border:1.5px solid var(--rule);border-radius:5px;font-size:.85rem;color:var(--ink-2);margin-top:.05rem}
.opt:hover .key{border-color:var(--ink);color:var(--ink)}
.lbl{display:block;font-weight:700;font-size:1.1rem;line-height:1.3}
.sub{display:block;color:var(--ink-2);font-size:.95rem;margin-top:.2rem}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem;margin-top:1.6rem}
.txtbtn{background:none;border:0;padding:.35rem 0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.btn{font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.6rem 1rem;cursor:pointer}
.txtbtn:focus-visible,.btn:focus-visible,.copy:focus-visible,.fbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--ink-2);font-size:.85rem;margin-left:auto}
@media (hover:none){.hint{display:none}}

/* leaf detail */
.meta{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;align-items:center;margin:.2rem 0 1.6rem;color:var(--ink-2)}
.ready{--st:var(--ready)} .helper{--st:var(--helper)} .judgment{--st:var(--judgment)}
.badge{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;color:var(--st)}
.shape{flex:none;display:inline-block;width:.72rem;height:.72rem;border-radius:50%;background:var(--st)}
.helper .shape{background:linear-gradient(90deg,var(--st) 50%,transparent 50%);box-shadow:inset 0 0 0 2px var(--st)}
.judgment .shape{border-radius:1px;transform:rotate(45deg) scale(.88)}
.facts{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:1.1rem 1.5rem;margin:0;max-width:52rem}
.facts dt{font-weight:700;color:var(--ink-2);font-size:.95rem;padding-top:.05rem}
.facts dd{margin:0;min-width:0}
.facts dd p{margin:.55rem 0 0}
.facts dd > p:first-child{margin-top:0}
.checks{margin:0;padding-left:1.1rem}
.checks li + li{margin-top:.5rem}
.checks code{display:block;margin-top:.15rem;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.code{position:relative;background:var(--code-bg);border-radius:6px;margin-top:.1rem}
.code + p{margin-top:.6rem}
.code pre{margin:0;padding:.85rem 4.6rem .85rem 1rem;overflow-x:auto;line-height:1.55}
.copy{position:absolute;top:.45rem;right:.45rem;font-size:.8rem;font-weight:700;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:.15rem .55rem;cursor:pointer}
.link{background:none;border:0;padding:0;margin-top:.35rem;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-align:left}
.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:.88rem;color:var(--ink-2)}
.imports{margin-top:1.6rem;max-width:52rem}
.imports code{font-size:.8rem}
@media (max-width:640px){.facts{grid-template-columns:1fr;gap:.25rem}.facts dd{margin-bottom:1.1rem}.code pre{padding:2.1rem 1rem .85rem}}

/* map view */
.mapbar{padding-block:2rem 1.4rem;border-bottom:1px solid var(--rule)}
.covline{margin:0 0 .65rem;font-size:1.05rem;max-width:62ch}
.bar{display:flex;gap:2px;height:.55rem;border-radius:99px;overflow:hidden;max-width:46rem}
.bar span{background:var(--st)}
.controls{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.2rem;align-items:flex-end}
.filters{display:flex;flex-wrap:wrap;gap:.6rem}
.fbtn{text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:8px;padding:.5rem .8rem;cursor:pointer;max-width:15.5rem}
.fbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fbtn .ft{display:flex;align-items:center;gap:.45rem;font-weight:700}
.fbtn .fd{display:block;font-size:.82rem;color:var(--ink-2);margin-top:.15rem;line-height:1.35}
.fbtn.all .shape{background:none;box-shadow:inset 0 0 0 2px var(--ink-2)}
.search{display:flex;flex-direction:column;gap:.25rem;margin-left:auto;min-width:min(15rem,100%)}
.search label{font-size:.85rem;color:var(--ink-2);font-weight:700}
.search input{font:inherit;padding:.5rem .7rem;border:1.5px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30rem);gap:clamp(1.5rem,3vw,3rem);padding-block:1.5rem 3.5rem;align-items:start}
.tree{min-width:0}
.rootq{font-weight:700;margin:0 0 .4rem}
.branch{list-style:none;margin:0;padding:0 0 0 1.05rem;border-left:1px solid var(--rule)}
.tree > .branch{border-left:0;padding-left:0}
details > summary{list-style:none;cursor:pointer;padding:.3rem .4rem .3rem 1.15rem;position:relative;border-radius:4px;display:flex;flex-wrap:wrap;gap:.1rem .6rem;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:"";position:absolute;left:.2rem;top:.72rem;border:5px solid transparent;border-left-color:var(--ink-2);border-right:0}
details[open] > summary::before{transform:rotate(90deg);transform-origin:30% 50%}
summary:hover{background:var(--surface)}
summary:focus-visible,.leafbtn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.via{color:var(--ink-2)}
.via.strong{color:var(--ink);font-weight:700}
.cq{color:var(--ink-2);font-size:.92rem}
.leafbtn{all:unset;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:baseline;gap:.1rem .6rem;width:100%;padding:.28rem .4rem .28rem 1.15rem;border-radius:4px;cursor:pointer}
.leafbtn:hover{background:var(--surface)}
.leafbtn[aria-current]{background:var(--marker);color:var(--marker-ink)}
.leafbtn[aria-current] .via{color:inherit}
.tname{display:inline-flex;align-items:center;gap:.45rem;font-weight:700}
.on-path > summary .via{background:linear-gradient(to top,var(--marker) 0 42%,transparent 42%)}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);max-height:calc(100vh - 2rem - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:1.25rem 1.3rem 1.5rem}
.detail h2{font-size:1.45rem;margin:0 0 .5rem}
.detail .facts{grid-template-columns:1fr;gap:.2rem}
.detail .facts dd{margin-bottom:1.1rem}
.detail .code{background:var(--paper)}
.detail .copy{background:var(--surface)}
.detail .code pre{padding:2.1rem 1rem .85rem}
.ask .nav{max-width:46rem}
.empty{color:var(--ink-2);margin:0}
@media (max-width:900px){.map{grid-template-columns:1fr}.detail{position:static;max-height:none}.search{margin-left:0}}
@media (max-width:820px){
  .find{grid-template-columns:1fr;gap:1.25rem;padding-top:1.5rem}
  .trail h2{margin-bottom:.5rem}
  .trail ol{display:flex;flex-wrap:wrap;gap:.4rem}
  .trail li{padding:0}
  .trail li::before,.trail li::after{display:none}
  .trail .q{display:none}
  .trail .a{font-size:.92rem;border:1px solid var(--rule);border-radius:99px;padding:.15rem .6rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Statistical test finder</h1>
      <p class="lede">From study design to the test your pipeline should run, and how to check it.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-find" aria-controls="view-find" aria-selected="true">Find a test</button>
      <button class="tab" role="tab" id="tab-map" aria-controls="view-map" aria-selected="false" tabindex="-1">Full map</button>
    </div>
  </header>

  <main>
    <section id="view-find" role="tabpanel" aria-labelledby="tab-find">
      <div class="find">
        <nav class="trail" aria-labelledby="trail-h">
          <h2 id="trail-h">Your path</h2>
          <ol id="trail"></ol>
        </nav>
        <div class="stage" id="stage" aria-live="polite"></div>
      </div>
    </section>

    <section id="view-map" role="tabpanel" aria-labelledby="tab-map" hidden>
      <div class="mapbar">
        <p class="covline" id="covline"></p>
        <div class="bar" id="bar" role="img"></div>
        <div class="controls">
          <div class="filters" id="filters" role="group" aria-label="Filter by readiness"></div>
          <div class="search">
            <label for="q">Search tests</label>
            <input id="q" type="search" placeholder="e.g. kappa, statsmodels, survival" autocomplete="off">
          </div>
        </div>
      </div>
      <div class="map">
        <div class="tree" id="tree"></div>
        <aside class="detail" id="mapDetail" aria-live="polite">
          <p class="empty">Pick a test in the map to see how to check, run and cross-check it.</p>
        </aside>
      </div>
    </section>
  </main>
</div>

<script>
const NODES = {
  root: {
    short: "Question", key: "goal",
    q: "What are you trying to find out?",
    help: "Pick the closest match. You can step back to any earlier answer.",
    opts: [
      { tl: "One outcome", label: "How one outcome differs or depends on something", sub: "Group comparisons, regression, survival. One outcome variable.", val: "single_outcome", to: "out_type" },
      { tl: "Several outcomes", label: "How several outcomes differ together", sub: "Two or more outcome variables analyzed jointly.", val: "multiple_outcomes", to: "mv" },
      { tl: "Association", label: "Whether two variables are related", sub: "Correlation or association, with no outcome–predictor split.", val: "association", to: "assoc" },
      { tl: "Agreement or accuracy", label: "How well raters, methods, or a diagnostic test agree", sub: "Reliability, method comparison, diagnostic accuracy.", val: "agreement_accuracy", to: "agree" }
    ]
  },
  out_type: {
    short: "Outcome", key: "outcome_type",
    q: "What type is the outcome variable?",
    help: "If a continuous measure was split into categories, choose continuous. Dichotomizing throws information away.",
    opts: [
      { tl: "Continuous", label: "Continuous", sub: "Measured on a scale: blood pressure, HbA1c, length of stay.", val: "continuous", to: "cont_struct" },
      { tl: "Ordinal", label: "Ordinal", sub: "Ordered categories: Likert items, tumor grade, pain scale.", val: "ordinal", to: "ord_struct" },
      { tl: "Binary", label: "Binary", sub: "Two categories: readmitted or not, responder or not.", val: "binary", to: "bin_struct" },
      { tl: "Nominal", label: "Nominal, three or more categories", sub: "Unordered categories: discharge destination, disease subtype.", val: "nominal", to: "nom_struct" },
      { tl: "Count", label: "Count", sub: "Number of events: ED visits per year, lesions per scan.", val: "count", to: "count_struct" },
      { tl: "Time to event", label: "Time to event", sub: "Time until an event happens, with some subjects censored.", val: "time_to_event", to: "surv" }
    ]
  },
  cont_struct: {
    short: "Structure", key: "structure",
    q: "How are the observations structured?",
    help: "This is the study-design axis. Treating paired or clustered data as independent makes standard errors too small.",
    opts: [
      { tl: "Independent", label: "Independent", sub: "Each subject contributes one measurement.", val: "independent", to: "cont_ind" },
      { tl: "Paired", label: "Paired or matched", sub: "Two measurements per subject, or matched pairs.", val: "paired", to: "L:paired_t" },
      { tl: "Repeated or clustered", label: "Repeated or clustered", sub: "Three or more measurements per subject, or subjects nested in sites.", val: "repeated_or_clustered", to: "cont_rep" }
    ]
  },
  cont_ind: {
    short: "Predictors", key: "predictors",
    q: "What are the predictors?",
    help: "A grouping variable is a categorical predictor, such as treatment arm.",
    opts: [
      { tl: "None", label: "None, compare with a reference value", sub: "A target, a norm, or a historical mean.", val: "none", to: "L:one_sample_t" },
      { tl: "2 groups", label: "One grouping variable, two groups", val: "one_factor_2_levels", to: "L:indep_t" },
      { tl: "3+ groups", label: "One grouping variable, three or more groups", val: "one_factor_3plus_levels", to: "L:oneway_anova" },
      { tl: "2+ factors", label: "Two or more grouping variables", sub: "For example treatment × sex, including the interaction.", val: "two_plus_factors", to: "L:factorial_anova" },
      { tl: "1 continuous", label: "One continuous predictor", val: "one_continuous", to: "L:simple_lin_reg" },
      { tl: "Several predictors", label: "Several predictors, or groups plus covariates", sub: "Multiple regression, or ANCOVA.", val: "multiple_mixed", to: "L:multiple_reg" }
    ]
  },
  cont_rep: {
    short: "Repeated pattern", key: "repeated_pattern",
    q: "What does the repeated structure look like?",
    help: "Most clinical longitudinal data has missing visits, which usually points to a mixed model.",
    opts: [
      { tl: "Complete, one factor", label: "One within-subject factor, every subject complete", sub: "Same time points for everyone, no missing data.", val: "one_within_factor_complete", to: "L:rm_anova" },
      { tl: "Missing or nested", label: "Missing visits, uneven timing, between-subject factors, or nesting", val: "unbalanced_or_nested", to: "L:lmm" },
      { tl: "Population-averaged", label: "You want population-averaged effects", sub: "The average effect across the population, not per subject.", val: "population_averaged", to: "L:gee_cont" }
    ]
  },
  ord_struct: {
    short: "Structure", key: "structure",
    q: "How are the observations structured?",
    opts: [
      { tl: "Independent", label: "Independent", sub: "Each subject contributes one measurement.", val: "independent", to: "ord_ind" },
      { tl: "Paired", label: "Paired or matched", val: "paired", to: "L:wilcoxon_signed" },
      { tl: "Repeated, complete", label: "Three or more conditions per subject, complete data", val: "repeated_complete", to: "L:friedman" },
      { tl: "Clustered or longitudinal", label: "Clustered or longitudinal, with covariates", val: "clustered_longitudinal", to: "L:ordinal_gee" }
    ]
  },
  ord_ind: {
    short: "Predictors", key: "predictors",
    q: "What are the predictors?",
    opts: [
      { tl: "None", label: "None, compare with a reference value", val: "none", to: "L:one_sample_wilcoxon" },
      { tl: "2 groups", label: "One grouping variable, two groups", val: "one_factor_2_levels", to: "L:mann_whitney" },
      { tl: "3+ groups", label: "One grouping variable, three or more groups", val: "one_factor_3plus_levels", to: "L:kruskal" },
      { tl: "1 continuous or ordinal", label: "One continuous or ordinal predictor", val: "one_continuous_or_ordinal", to: "L:spearman" },
      { tl: "Several predictors", label: "Several predictors", val: "multiple", to: "L:ordinal_logit" }
    ]
  },
  bin_struct: {
    short: "Structure", key: "structure",
    q: "How are the observations structured?",
    opts: [
      { tl: "Independent", label: "Independent", sub: "Each subject contributes one measurement.", val: "independent", to: "bin_ind" },
      { tl: "Paired", label: "Paired or matched", sub: "Same subjects measured twice, or matched pairs.", val: "paired", to: "L:mcnemar" },
      { tl: "Repeated, complete", label: "Three or more conditions per subject, complete data", val: "repeated_complete", to: "L:cochran_q" },
      { tl: "Clustered or longitudinal", label: "Clustered or longitudinal, with covariates", sub: "Patients within clinics, visits within patients.", val: "clustered_longitudinal", to: "L:gee_logit" }
    ]
  },
  bin_ind: {
    short: "Predictors", key: "predictors",
    q: "What are the predictors?",
    opts: [
      { tl: "None", label: "None, compare with a reference proportion", val: "none", to: "L:binom_test" },
      { tl: "2 groups", label: "One grouping variable, two groups", val: "one_factor_2_levels", to: "L:two_by_two" },
      { tl: "3+ groups", label: "One grouping variable, three or more groups", val: "one_factor_3plus_levels", to: "L:chi_sq_indep" },
      { tl: "Continuous or several", label: "A continuous predictor, or several predictors", val: "continuous_or_multiple", to: "L:logistic" }
    ]
  },
  nom_struct: {
    short: "Structure", key: "structure",
    q: "How are the observations structured?",
    opts: [
      { tl: "Independent", label: "Independent", sub: "Each subject contributes one measurement.", val: "independent", to: "nom_ind" },
      { tl: "Paired", label: "Paired", sub: "The same subjects classified twice.", val: "paired", to: "L:stuart_maxwell" },
      { tl: "Clustered or longitudinal", label: "Clustered or longitudinal", val: "clustered_longitudinal", to: "L:nominal_gee" }
    ]
  },
  nom_ind: {
    short: "Predictors", key: "predictors",
    q: "What are the predictors?",
    opts: [

    name: "Cohen's kappa", family: "Agreement and accuracy", status: "ready",
    when: "Two raters assign categories to the same items. Use weighted kappa for ordinal ratings.",
    checks: [
      { k: "same_categories", t: "Both raters use the same set of categories" },
      { k: "prevalence", t: "Kappa drops when one category dominates. Report raw agreement too" }
    ],
    run: "from statsmodels.stats.inter_rater import cohens_kappa, to_table\ntable, _ = to_table(np.column_stack([r1, r2]))\ncohens_kappa(table, wt='quadratic')  # omit wt for nominal ratings",
    call: "statsmodels cohens_kappa",
    cross: { c: "from sklearn.metrics import cohen_kappa_score\ncohen_kappa_score(r1, r2, weights='quadratic')", why: "Point estimates should match. statsmodels adds the standard error and CI." },
    xcall: "sklearn cohen_kappa_score",
    report: "κ with 95% CI, plus percent agreement."
  },
  fleiss_kappa: {
    name: "Fleiss' kappa", family: "Agreement and accuracy", status: "ready",
    when: "Three or more raters assign categories to the same items.",
    checks: [
      { k: "complete_ratings", t: "Every item rated by the same number of raters. If not, use Krippendorff's α" }
    ],
    run: "from statsmodels.stats.inter_rater import fleiss_kappa, aggregate_raters\ncounts, _ = aggregate_raters(ratings)  # ratings: items × raters\nfleiss_kappa(counts)",
    call: "statsmodels fleiss_kappa",
    cross: { c: "import krippendorff\nkrippendorff.alpha(reliability_data=ratings.T,\n                   level_of_measurement='nominal')", why: "Krippendorff's α is close to Fleiss' κ for complete nominal data, and also handles missing ratings." },
    xcall: "krippendorff.alpha",
    report: "κ with bootstrap 95% CI."
  },
  bland_altman: {
    name: "Bland–Altman analysis", family: "Agreement and accuracy", status: "helper",
    when: "Two methods measure the same continuous quantity, such as a new device against a reference.",
    checks: [
      { k: "difference_normality", t: "Differences roughly normal" },
      { k: "proportional_bias", t: "No proportional bias: regress differences on means", c: "sm.OLS(d, sm.add_constant((m1 + m2) / 2)).fit()" }
    ],
    fb: { t: "Log-transform, or report ratio limits, if differences grow with magnitude.", k: "log_limits" },
    run: "d = m1 - m2\nbias, sd = d.mean(), d.std(ddof=1)\nloa = (bias - 1.96 * sd, bias + 1.96 * sd)",
    call: "custom limits of agreement",
    cross: { c: "sm.graphics.mean_diff_plot(m1, m2)", why: "The plot draws its own bias and limit lines. They should sit exactly where the hand-computed values say." },
    xcall: "statsmodels mean_diff_plot",
    report: "Bias and 95% limits of agreement, each with a CI.",
    watch: "Correlation measures association, not agreement. Two methods can correlate at 0.99 and still disagree clinically."
  },
  icc: {
    name: "Intraclass correlation (ICC)", family: "Agreement and accuracy", status: "judgment",
    when: "Reliability of continuous ratings across raters, or across repeated measurements.",
    checks: [
      { k: "icc_form", t: "Form chosen: one-way or two-way, random or fixed raters, agreement or consistency, single or average" },
      { k: "residual_normality", t: "Residuals roughly normal" }
    ],
    run: "import pingouin as pg\npg.intraclass_corr(data=df, targets='patient', raters='rater', ratings='score')",
    call: "pingouin.intraclass_corr",
    cross: { c: "# ICC(2,1) from two-way ANOVA mean squares\nm = smf.ols('score ~ C(patient) + C(rater)', df).fit()\nsm.stats.anova_lm(m)", why: "Plug the mean squares into the Shrout–Fleiss formula. It should reproduce pingouin's ICC2 row." },
    xcall: "two-way ANOVA mean squares",
    report: "ICC form named explicitly, such as ICC(2,1) absolute agreement, with 95% CI.",
    watch: "Six ICC forms give different numbers on the same data. The design decides the form; the tool should ask, not guess."
  },
  diag_binary: {
    name: "Sensitivity, specificity and predictive values", family: "Agreement and accuracy", status: "helper",
    when: "A binary test result compared with a gold-standard diagnosis.",
    checks: [
      { k: "verification", t: "Gold standard applied to everyone, not only to test positives" },
      { k: "prevalence", t: "PPV and NPV depend on prevalence. Skip them in case–control samples" }
    ],
    run: "from sklearn.metrics import confusion_matrix\nfrom statsmodels.stats.proportion import proportion_confint\ntn, fp, fn, tp = confusion_matrix(truth, test).ravel()\nsens, spec = tp / (tp + fn), tn / (tn + fp)\nproportion_confint(tp, tp + fn, method='wilson')",
    call: "custom from confusion_matrix + proportion_confint",
    cross: { c: "pd.crosstab(truth, test)", why: "An independent tally catches label-encoding mistakes about which class is positive, the most common bug here." },
    xcall: "pandas crosstab",
    report: "Sensitivity and specificity with Wilson CIs; LR+ and LR−."
  },
  roc_auc: {
    name: "ROC curve and AUC", family: "Agreement and accuracy", status: "helper",
    when: "A continuous score or predicted probability compared with a binary gold standard.",
    checks: [
      { k: "positive_class", t: "Positive class defined explicitly" },
      { k: "ci_method", t: "No CI in sklearn. Use a stratified bootstrap or DeLong" }
    ],
    run: "from sklearn.metrics import roc_auc_score, roc_curve\nauc = roc_auc_score(y, score)\nfpr, tpr, thr = roc_curve(y, score)",
    call: "sklearn roc_auc_score",
    cross: { c: "u = stats.mannwhitneyu(score[y == 1], score[y == 0]).statistic\nu / ((y == 1).sum() * (y == 0).sum())", why: "AUC equals the Mann–Whitney U divided by n₁n₀. They must match exactly; if not, the positive class is flipped." },
    xcall: "scipy.stats.mannwhitneyu / (n1 * n0)",
    report: "AUC with 95% CI; sensitivity and specificity at a pre-specified threshold.",
    watch: "A threshold chosen on the same data you report it on is optimistic. Fix it in advance or validate it."
  },
  delong: {
    name: "DeLong test for paired AUCs", family: "Agreement and accuracy", status: "helper",
    when: "Two scores evaluated on the same patients: is one AUC larger?",
    checks: [
      { k: "same_patients", t: "Same patients and the same outcome labels for both scores" },
      { k: "not_nested", t: "Not a model compared with the same model plus one marker" }
    ],
    run: "# not in scipy, statsmodels or sklearn: write it once\n# (fast DeLong, Sun and Xu 2014) and unit-test it\nauc_a, auc_b, p = delong_paired(y, score_a, score_b)",
    call: "custom delong_paired",
    cross: { c: "rng = np.random.default_rng(0)\ndiffs = []\nfor _ in range(2000):\n    i = rng.integers(0, len(y), len(y))\n    diffs.append(roc_auc_score(y[i], a[i]) - roc_auc_score(y[i], b[i]))\nnp.percentile(diffs, [2.5, 97.5])", why: "A paired bootstrap of the AUC difference should give a similar CI. Use it to validate your DeLong implementation." },
    xcall: "paired bootstrap of the AUC difference",
    report: "AUC difference with 95% CI and p-value.",
    watch: "Don't use it to test whether adding a marker to a nested model improves AUC; that comparison is known to be invalid. Test the marker's coefficient instead."
  }
};


const STATUS = {
  ready:    { label: "Ready",               desc: "One scipy or statsmodels call. Safe to automate." },
  helper:   { label: "Needs a helper",      desc: "No single call. Needs a small function or another package." },
  judgment: { label: "Needs your judgment", desc: "Modeling decisions the pipeline shouldn't make alone." }
};
const IMPORTS = "from scipy import stats; import numpy as np; import pandas as pd; import statsmodels.api as sm; import statsmodels.formula.api as smf";
const STORE = "stf.v1";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isLeaf = id => id.startsWith("L:");
const leafId = id => id.slice(2);

let choices = [];
let fStatus = "all";
let fText = "";

function walk(ch) {
  const seq = [];
  let id = "root";
  for (const c of ch) {
    if (isLeaf(id)) return null;
    const n = NODES[id];
    if (!n || !n.opts[c]) return null;
    seq.push({ id, c, n, o: n.opts[c] });
    id = n.opts[c].to;
  }
  return { seq, end: id };
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ choices })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const v = JSON.parse(raw);
    if (Array.isArray(v.choices) && walk(v.choices)) choices = v.choices;
  } catch (e) {}
}

/* ---------- shared detail renderer ---------- */
function codeBlock(c) {
  return `<div class="code"><pre><code>${esc(c)}</code></pre><button type="button" class="copy">Copy</button></div>`;
}
function spec(lid, seq) {
  const L = LEAVES[lid];
  const design = {};
  seq.forEach(s => { design[s.n.key] = s.o.val; });
  return {
    design,
    test: lid,
    status: L.status,
    call: L.call,
    assumption_checks: L.checks.map(c => c.k),
    fallback: L.fb ? (L.fb.to || L.fb.k || null) : null,
    cross_check: L.xcall
  };
}
function leafDetail(lid, seq, hid) {
  const L = LEAVES[lid];
  const st = STATUS[L.status];
  const checks = L.checks.map(c => `<li>${esc(c.t)}${c.c ? `<code>${esc(c.c)}</code>` : ""}</li>`).join("");
  let fb = "";
  if (L.fb) {
    fb = `<dt>If a check fails</dt><dd><p>${esc(L.fb.t)}</p>` +
      (L.fb.c ? codeBlock(L.fb.c) : "") +
      (L.fb.to ? `<button type="button" class="link" data-goto="${L.fb.to}">Open ${esc(LEAVES[L.fb.to].name)} in the map</button>` : "") +
      `</dd>`;
  }
  return `
    <header class="lh">
      <h2 id="${hid}" tabindex="-1">${esc(L.name)}</h2>
      <p class="meta"><span class="badge ${L.status}" title="${esc(st.desc)}"><span class="shape" aria-hidden="true"></span>${st.label}</span><span>${esc(L.family)}</span></p>
    </header>
    <dl class="facts">
      <dt>Use it when</dt><dd><p>${esc(L.when)}</p></dd>
      <dt>Check first</dt><dd><ul class="checks">${checks}</ul></dd>
      ${fb}
      <dt>Run it</dt><dd>${codeBlock(L.run)}</dd>
      <dt>Cross-check</dt><dd>${codeBlock(L.cross.c)}<p>${esc(L.cross.why)}</p></dd>
      <dt>Report</dt><dd><p>${esc(L.report)}</p></dd>
      ${L.post ? `<dt>Post-hoc</dt><dd><p>${esc(L.post)}</p></dd>` : ""}
      ${L.watch ? `<dt>Watch out</dt><dd><p>${esc(L.watch)}</p></dd>` : ""}
      <dt>Pipeline spec</dt><dd>${codeBlock(JSON.stringify(spec(lid, seq), null, 2))}<p class="small">What the reasoning layer hands to the pipeline for this path.</p></dd>
    </dl>
    <p class="small imports">Snippets assume <code>${esc(IMPORTS)}</code></p>`;
}

/* ---------- find view ---------- */
function renderFind(focus) {
  const w = walk(choices) || walk(choices = []);
  const { seq, end } = w;

  const items = seq.map((s, i) =>
    `<li class="done"><button type="button" data-step="${i}" aria-label="Change ${esc(s.n.short)}: ${esc(s.o.tl)}"><span class="q">${esc(s.n.short)}</span><span class="a"><span class="mk">${esc(s.o.tl)}</span></span></button></li>`
  );
  if (isLeaf(end)) {
    items.push(`<li class="end"><span class="q">Test</span><span class="a"><span class="mk full">${esc(LEAVES[leafId(end)].name)}</span></span></li>`);
  } else {
    items.push(`<li class="now"><span class="q">${esc(NODES[end].short)}</span><span class="a pending">Not answered yet</span></li>`);
  }
  $("#trail").innerHTML = items.join("");

  const stage = $("#stage");
  if (isLeaf(end)) {
    stage.innerHTML = `<div class="result">${leafDetail(leafId(end), seq, "qh")}
      <div class="nav">
        <button type="button" class="btn" data-act="tomap">Show in full map</button>
        <button type="button" class="txtbtn" data-act="back">Change last answer</button>
        <button type="button" class="txtbtn" data-act="restart">Start over</button>
      </div></div>`;
  } else {
    const n = NODES[end];
    const opts = n.opts.map((o, i) =>
      `<li><button type="button" class="opt" data-opt="${i}"><span class="key" aria-hidden="true">${i + 1}</span><span><span class="lbl">${esc(o.label)}</span>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ""}</span></button></li>`
    ).join("");
    stage.innerHTML = `<div class="ask">
      <h2 id="qh" tabindex="-1">${esc(n.q)}</h2>
      ${n.help ? `<p class="help">${esc(n.help)}</p>` : ""}
      <ol class="opts">${opts}</ol>
      <div class="nav">
        ${choices.length ? `<button type="button" class="txtbtn" data-act="back">Back</button><button type="button" class="txtbtn" data-act="restart">Start over</button>` : ""}
        <span class="hint">Press 1–${n.opts.length} to choose</span>
      </div></div>`;
  }
  save();
  if (focus) { const h = $("#qh"); if (h) h.focus({ preventScroll: true }); }
}

function choose(i) {
  const w = walk(choices);
  if (!w || isLeaf(w.end)) return;
  if (!NODES[w.end].opts[i]) return;
  choices = choices.concat(i);
  renderFind(true);
  if (window.scrollY > 200) $("#view-find").scrollIntoView({ block: "start" });
}

/* ---------- map view ---------- */
function branch(id, prefix) {
  const n = NODES[id];
  return `<ul class="branch">${n.opts.map((o, i) => {
    const p = prefix.concat(i).join(".");
    if (isLeaf(o.to)) {
      const lid = leafId(o.to), L = LEAVES[lid];
      return `<li class="leafrow" data-leaf="${lid}" data-path="${p}"><button type="button" class="leafbtn ${L.status}" data-leaf="${lid}" data-path="${p}"><span class="via">${esc(o.tl)}</span><span class="tname"><span class="shape" aria-hidden="true"></span><span class="sr">${STATUS[L.status].label}: </span>${esc(L.name)}</span></button></li>`;
    }
    return `<li><details open data-path="${p}"><summary><span class="via strong">${esc(o.tl)}</span><span class="cq">${esc(NODES[o.to].q)}</span></summary>${branch(o.to, prefix.concat(i))}</details></li>`;
  }).join("")}</ul>`;
}

function buildMap() {
  $("#tree").innerHTML = `<p class="rootq">${esc(NODES.root.q)}</p>${branch("root", [])}`;
  const ids = Object.keys(LEAVES);
  const counts = { ready: 0, helper: 0, judgment: 0 };
  ids.forEach(k => counts[LEAVES[k].status]++);
  const paths = $$(".leafrow").length;
  $("#covline").innerHTML = `<strong>${ids.length} tests</strong> reachable through ${paths} decision paths. ${counts.ready} are ready to automate today; the rest need a helper function or your judgment.`;
  const bar = $("#bar");
  bar.innerHTML = ["ready", "helper", "judgment"].map(k => `<span class="${k}" style="flex:${counts[k]}"></span>`).join("");
  bar.setAttribute("aria-label", `${counts.ready} ready, ${counts.helper} need a helper, ${counts.judgment} need your judgment`);
  const fbtns = [`<button type="button" class="fbtn all" data-filter="all" aria-pressed="true"><span class="ft"><span class="shape" aria-hidden="true"></span>All tests ${ids.length}</span><span class="fd">Every leaf in the tree.</span></button>`]
    .concat(["ready", "helper", "judgment"].map(k =>
      `<button type="button" class="fbtn ${k}" data-filter="${k}" aria-pressed="false"><span class="ft"><span class="shape" aria-hidden="true"></span>${STATUS[k].label} ${counts[k]}</span><span class="fd">${STATUS[k].desc}</span></button>`));
  $("#filters").innerHTML = fbtns.join("");
}

function applyFilter() {
  const q = fText.trim().toLowerCase();
  let shown = 0;
  $$(".leafrow").forEach(r => {
    const L = LEAVES[r.dataset.leaf];
    const okS = fStatus === "all" || L.status === fStatus;
    const okT = !q || `${L.name} ${L.family} ${L.call} ${L.xcall}`.toLowerCase().includes(q);
    r.hidden = !(okS && okT);
    if (!r.hidden) shown++;
  });
  $$("#tree details").forEach(d => {
    d.parentElement.hidden = !d.querySelector(".leafrow:not([hidden])");
    if (fStatus !== "all" || q) d.open = true;
  });
  $$(".fbtn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === fStatus)));
  let empty = $("#tree .empty");
  if (!shown) {
    if (!empty) $("#tree").insertAdjacentHTML("beforeend", `<p class="empty">No tests match. <button type="button" class="link" data-act="clearfilter">Clear the search and filter</button></p>`);
  } else if (empty) empty.remove();
}

function clearFilter() {
  fStatus = "all"; fText = ""; $("#q").value = "";
  applyFilter();
}

function highlightPath(ch) {
  $$("#tree .on-path").forEach(el => el.classList.remove("on-path"));
  for (let i = 1; i < ch.length; i++) {
    const d = $(`#tree details[data-path="${ch.slice(0, i).join(".")}"]`);
    if (d) { d.classList.add("on-path"); d.open = true; }
  }
}

function selectMapLeaf(btn, opts = {}) {
  $$(".leafbtn[aria-current]").forEach(b => b.removeAttribute("aria-current"));
  btn.setAttribute("aria-current", "true");
  const ch = btn.dataset.path.split(".").map(Number);
  const w = walk(ch);
  $("#mapDetail").innerHTML = leafDetail(btn.dataset.leaf, w.seq, "mh");
  $("#mapDetail").scrollTop = 0;
  highlightPath(ch);
  if (opts.scrollRow) btn.scrollIntoView({ block: "center" });
  if (window.matchMedia("(max-width: 900px)").matches && !opts.scrollRow) {
    $("#mapDetail").scrollIntoView({ block: "start" });
  }
}

function openInMap(selector) {
  showTab("map");
  clearFilter();
  const btn = $(selector);
  if (btn) {
    selectMapLeaf(btn, { scrollRow: !window.matchMedia("(max-width: 900px)").matches });
    if (window.matchMedia("(max-width: 900px)").matches) $("#mapDetail").scrollIntoView({ block: "start" });
  }
}

/* ---------- tabs ---------- */
function showTab(which) {
  const find = which === "find";
  $("#tab-find").setAttribute("aria-selected", String(find));
  $("#tab-map").setAttribute("aria-selected", String(!find));
  $("#tab-find").tabIndex = find ? 0 : -1;
  $("#tab-map").tabIndex = find ? -1 : 0;
  $("#view-find").hidden = !find;
  $("#view-map").hidden = find;
}

/* ---------- copy ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.classList.contains("tab")) { showTab(t.id === "tab-find" ? "find" : "map"); return; }
  if (t.dataset.opt !== undefined) { choose(Number(t.dataset.opt)); return; }
  if (t.dataset.step !== undefined) { choices = choices.slice(0, Number(t.dataset.step)); renderFind(true); return; }
  if (t.classList.contains("leafbtn")) { selectMapLeaf(t); return; }
  if (t.dataset.filter) { fStatus = t.dataset.filter; applyFilter(); return; }
  if (t.dataset.goto) { openInMap(`.leafbtn[data-leaf="${t.dataset.goto}"]`); return; }
  if (t.classList.contains("copy")) {
    const ok = await copyText(t.previousElementSibling.textContent);
    t.textContent = ok ? "Copied" : "Select the text to copy";
    setTimeout(() => { t.textContent = "Copy"; }, 1600);
    return;
  }
  switch (t.dataset.act) {
    case "back": choices = choices.slice(0, -1); renderFind(true); break;
    case "restart": choices = []; renderFind(true); break;
    case "tomap": openInMap(`.leafbtn[data-path="${choices.join(".")}"]`); break;
    case "clearfilter": clearFilter(); break;
  }
});

$("#q").addEventListener("input", e => { fText = e.target.value; applyFilter(); });

$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const next = document.activeElement.id === "tab-find" ? "map" : "find";
  showTab(next);
  $(`#tab-${next}`).focus();
  e.preventDefault();
});

document.addEventListener("keydown", e => {
  if ($("#view-find").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (/^[1-9]$/.test(e.key)) { choose(Number(e.key) - 1); e.preventDefault(); }
  else if (e.key === "Backspace" && choices.length) { choices = choices.slice(0, -1); renderFind(true); e.preventDefault(); }
});

load();
buildMap();
renderFind(false);
</script>
</body>
</html>
