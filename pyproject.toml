[project]
name = "whichtest"
version = "0.1.0"
description = "Pick the right statistical test from a study design, check its assumptions, run it, and cross-check the result with a second implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Independent libraries used only for cross-checks and post-hoc helpers.
cross = [
    "pingouin>=0.5.4",
    "lifelines>=0.30",
    "krippendorff>=0.6",
    "scikit-posthocs>=0.8",
    "semopy>=2.3.11",
    "matplotlib>=3.7",  # statsmodels mean_diff_plot, the Bland–Altman cross-check
]
dev = [
    "pytest>=7",
    "json5>=0.9",
    "whichtest[cross]",
]

[project.scripts]
whichtest = "whichtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whichtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Starting with pandas version 4.0",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.hatch.build.targets.wheel.force-include]
"taxonomy.json" = "whichtest/taxonomy.json"
